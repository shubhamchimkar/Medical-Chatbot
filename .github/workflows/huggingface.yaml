name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Prepare deployment bundle (exclude large/unneeded files)
        run: |
          set -e
          rm -rf /tmp/hf-deploy && mkdir -p /tmp/hf-deploy
          rsync -a . /tmp/hf-deploy \
            --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "data/" \
            --exclude "research/" \
            --exclude "venv/" \
            --exclude "**/__pycache__/" \
            --exclude "*.ipynb" \
            --exclude "*.pdf" \
            --exclude "*.pt" \
            --exclude "*.bin" \
            --exclude "*.zip" \
            --exclude "*.gz" \
            --exclude "assets/" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg"
          cd /tmp/hf-deploy
          # show what will be pushed
          echo "Contents to push:" && ls -la

      - name: Configure git in bundle
        run: |
          cd /tmp/hf-deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from GitHub Actions (filtered bundle)"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          cd /tmp/hf-deploy
          # Use oauth2 token auth (recommended by Hugging Face)
          git remote add hf https://oauth2:${HF_TOKEN}@huggingface.co/spaces/Monster10/medi-bot
          git branch -M main
          git push hf main --force
